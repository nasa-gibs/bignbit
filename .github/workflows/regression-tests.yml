# Runs the regression test suite (see regression/) against a deployed venue and publishes the report
name: Regression Tests
run-name: Regression Tests (${{ inputs.venue || 'SANDBOX' }})
on:
  schedule:
    # 10:00 UTC every Monday. Scheduled runs have no inputs, so they target SANDBOX (see the
    # "inputs.venue || 'SANDBOX'" expressions below) and always publish to the wiki.
    - cron: '0 10 * * 1'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      venue:
        type: choice
        description: Venue to test
        default: SANDBOX
        options:
          - SANDBOX
          - SIT
          - UAT
      collections:
        type: string
        description: Collection short names to test, space or comma separated (empty = all)
        required: false
        default: ''
      max_parallel:
        type: string
        description: Number of test cases to run at the same time
        required: false
        default: '8'
      publish_to_wiki:
        type: boolean
        description: Publish the report to the repository wiki
        default: true
# Only one run per venue at a time, so runs do not compete for the same deployment or race on the
# venue's wiki page. A newer run waits for the one in progress instead of cancelling it.
concurrency:
  group: regression-tests-${{ inputs.venue || 'SANDBOX' }}
  cancel-in-progress: false
env:
  POETRY_VERSION: "2.1.3"
  PYTHON_VERSION: "3.12"
  # inputs.venue is empty for scheduled runs, which default to SANDBOX
  VENUE: ${{ inputs.venue || 'SANDBOX' }}
  REPORT_DIR: build/regression/report
defaults:
  run:
    shell: bash
jobs:
  regression:
    name: Run regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    # Same environment and credentials selection as the Deploy job in cicd-pipeline.yml
    environment: ${{ inputs.venue || 'SANDBOX' }}
    env:
      # SANDBOX is deployed to us-east-1; all other venues use us-west-2
      AWS_REGION: ${{ (inputs.venue || 'SANDBOX') == 'SANDBOX' && 'us-east-1' || 'us-west-2' }}
    outputs:
      has_report: ${{ steps.summary.outputs.has_report }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Install dependencies
        # The suite only needs boto3 and requests, so there is no need for the conda/micromamba
        # environment (GDAL), the dev dependencies, or the bignbit package itself.
        run: poetry install --only main --no-root
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions
          aws-access-key-id: ${{ secrets[vars.AWS_ACCESS_KEY_ID_SECRET_NAME] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_SECRET_ACCESS_KEY_SECRET_NAME] }}
          mask-aws-account-id: true
      - name: Run regression suite
        # Exits 0 if every case passed, 1 if any case failed or mismatched, 2 if the run could not
        # start. A non-zero exit fails this job; the report steps below still run.
        env:
          # Earthdata Login account the suite uses to get a CMR token, so that access controlled
          # collections and granules are found
          EDL_USER: ${{ secrets.EDL_USER }}
          EDL_PASS: ${{ secrets.EDL_PASS }}
          COLLECTIONS: ${{ inputs.collections }}
          # Empty for scheduled runs, which use the suite's default
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          venue="$(echo "$VENUE" | tr '[:upper:]' '[:lower:]')"
          args=(--venue "$venue" --report-dir "$REPORT_DIR")
          # Split the collections input on commas and whitespace
          only=()
          read -r -d '' -a only <<< "${COLLECTIONS//,/ }" || true
          for short_name in "${only[@]}"; do
            if [[ ! "$short_name" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
              echo "::error::Invalid collection short name in the collections input: '${short_name}'"
              exit 2
            fi
          done
          if [ "${#only[@]}" -gt 0 ]; then
            args+=(--only "${only[@]}")
          fi
          if [ -n "$MAX_PARALLEL" ]; then
            if [[ ! "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid max_parallel input: '${MAX_PARALLEL}' is not a positive whole number"
              exit 2
            fi
            args+=(--max-parallel "$MAX_PARALLEL")
          fi
          poetry run python -m regression run "${args[@]}"
      - name: Add report to job summary
        id: summary
        if: always()
        run: |
          report="${REPORT_DIR}/report.md"
          if [ ! -s "$report" ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The regression suite did not write ${report}"
            echo "The regression suite did not produce a report. See the job log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "has_report=true" >> "$GITHUB_OUTPUT"
          # Job summaries are limited to 1MiB per step; the full report is always in the artifact
          if [ "$(wc -c < "$report")" -gt 900000 ]; then
            head -c 900000 "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n_Report truncated. Download the regression-report-%s artifact for the full report._\n' "$VENUE" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-${{ env.VENUE }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
  publish:
    name: Publish report to wiki
    # A separate job so that the token with write access is never present alongside the AWS
    # credentials, and the job that runs the suite only ever holds a read-only token.
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Publish whether the suite passed or failed, but not if it was cancelled or skipped.
    # Scheduled runs always publish; manual runs only if publish_to_wiki is checked.
    if: |
      !cancelled() &&
      (needs.regression.result == 'success' || needs.regression.result == 'failure') &&
      (github.event_name == 'schedule' || inputs.publish_to_wiki)
    env:
      HAS_REPORT: ${{ needs.regression.outputs.has_report }}
    steps:
      - name: Check for a report
        id: report
        run: |
          if [ "$HAS_REPORT" = "true" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The regression job did not produce a report; nothing to publish"
            echo "The regression job did not produce a report, so the wiki was not updated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download report
        if: steps.report.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: regression-report-${{ env.VENUE }}
          path: report
      - name: Checkout wiki
        # The wiki is its own git repository; its default branch is master
        if: steps.report.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          ref: master
          path: wiki
      - name: Publish report to wiki
        if: steps.report.outputs.found == 'true'
        run: |
          case "$VENUE" in
            SANDBOX|SIT|UAT) ;;
            *) echo "::error::Unexpected venue '${VENUE}'"; exit 1 ;;
          esac
          page="Regression-Test-Report-${VENUE}"
          if [ ! -s report/report.md ]; then
            echo "::warning::report.md is missing from the regression-report-${VENUE} artifact; nothing to publish"
            echo "report.md was missing from the artifact, so the wiki was not updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Overwrite this venue's page only; the wiki's page history keeps the previous reports
          cp report/report.md "wiki/${page}.md"
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${page}.md"
          if git diff --cached --quiet; then
            echo "Report is identical to the published page; nothing to commit"
          else
            git commit -m "Regression test report for ${VENUE} (run #${GITHUB_RUN_NUMBER})"
            # A run for another venue may have pushed its own page in the meantime
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt ${attempt}); rebasing onto the latest wiki history"
              git pull --rebase origin master
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push ${page}.md to the wiki"
              exit 1
            fi
          fi
          echo "Report published to ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki/${page}" >> "$GITHUB_STEP_SUMMARY"
